# Development compose - DB + Nginx, App runs locally on host
# Usage: docker compose -f compose.dev.yaml up -d
#        pnpm pm2  (to start App on host)

services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: gabarita_nginx
    restart: always
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - db
    extra_hosts:
      - "host.containers.internal:host-gateway"

  db:
    image: ankane/pgvector:latest
    container_name: gabarita_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-gabarita_ai}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-gabarita_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  nginx_logs:
